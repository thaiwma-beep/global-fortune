@keyframes ballBounce {
  0%,100% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-16px) scale(1.05);
  }
}

.animate-ball {
  animation: ballBounce .45s ease-in-out infinite;
}

@keyframes revealIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.animate-reveal {
  animation: revealIn .35s ease-out;
}

.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:mb-8{
    margin-bottom: 2rem;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-8{
    padding-top: 2rem;
  }

  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[380px_minmax\(0\2c 1fr\)\]{
    grid-template-columns: 380px minmax(0,1fr);
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

eaning:"ยืดหยุ่นกับแผนที่เปลี่ยนไป จะถึงเป้าหมายได้โดยไม่ต้องเหนื่อยเกินจำเป็น"},{poem:["แสงเทียนเล็ก ๆ ในห้องมืด","ความหวังเล็ก ๆ ก็พอส่องทางได้"],meaning:"เริ่มจากเรื่องเล็กที่ทำได้จริง ความมั่นใจจะค่อย ๆ กลับมา"},{poem:["เพื่อนเก่าเดินกลับมาพร้อมรอยยิ้ม","ความสัมพันธ์ดี ๆ ไม่เคยหายไปไหน"],meaning:"คนรอบตัวพร้อมช่วย อย่ากลัวที่จะขอคำปรึกษาหรือขอความช่วยเหลือ"},{poem:["ภูเขาสูงมองเห็นทุ่งกว้าง","ยืนให้สูงกว่าเรื่องกังวลสักนิด"],meaning:"ถอยออกมามองภาพใหญ่ จะเห็นว่าปัญหาตรงหน้าเล็กกว่าที่คิด"},{poem:["ฝนโปรยเบา ๆ บนหลังคาบ้าน","ข่าวดีเล็ก ๆ กำลังเดินทางมาหา"],meaning:"เรื่องดีกำลังเข้ามาทีละน้อย เปิดใจรับโอกาสเล็ก ๆ ที่ไม่คาดคิด"},{poem:["กุญแจดอกเก่าไขประตูใหม่","ประสบการณ์เดิมใช้ได้กับเรื่องใหม่"],meaning:"สิ่งที่เคยเรียนรู้จะกลับมาช่วยในจังหวะนี้ อย่าดูถูกประสบการณ์ของตัวเอง"},{poem:["ดาวดวงเล็กส่องทางคนเดินทาง","ไม่ต้องสว่างที่สุดก็พาใครไปได้"],meaning:"เป็นตัวของตัวเองต่อไป คุณกำลังเป็นแรงบันดาลใจให้ใครบางคนโดยไม่รู้ตัว"},{poem:["ต้นไม้ใหญ่ไม่โตในวันเดียว","รากที่ลึกคือความมั่นคงที่แท้จริง"],meaning:"วางรากฐานให้แน่นก่อนเร่งโต ความช้าตอนนี้คือความมั่นคงในระยะยาว"},{poem:["จดหมายที่รอคอยมาถึงแล้ว","คำตอบที่ตามหาอยู่ใกล้กว่าที่คิด"],meaning:"ข่าวหรือคำตอบที่รอจะมาถึง ลองถามอีกครั้งหรือเช็กเรื่องที่ค้างอยู่"},{poem:["ทางแยกมีป้ายบอกทางชัดเจน","เลือกทางที่ใจสงบ ไม่ใช่ทางที่เสียงดัง"],meaning:"เมื่อต้องเลือก ให้ฟังเสียงของตัวเองมากกว่าความกดดันรอบข้าง"},{poem:["หมอกเช้าจางลงเมื่อแดดออก","เรื่องที่กังวลจะคลี่คลายทีละนิด"],meaning:"ความไม่ชัดเจนจะค่อย ๆ หายไป อย่าตัดสินใจใหญ่ในวันที่ใจยังขุ่น"},{poem:["ก้าวช้า ๆ บนสะพานไม้เก่า","ระวังทุกก้าว แต่อย่าหยุดเดิน"],meaning:"ช่วงนี้ต้องรอบคอบเป็นพิเศษ ตรวจรายละเอียดซ้ำก่อนตัดสินใจเรื่องสำคัญ"},{poem:["ลมแรงพัดใบไม้ให้ร่วงหล่น","ปล่อยเรื่องที่ไม่จำเป็นออกไปบ้าง"],meaning:"บางอย่างต้องปล่อยไปเพื่อให้มีที่ว่างสำหรับสิ่งใหม่ที่ดีกว่า"},{poem:["ตะเกียงน้ำมันใกล้หมดแต่ยังส่อง","พักบ้างก็ได้ ไม่ต้องสว่างตลอดเวลา"],meaning:"พลังงานกำลังหมด ให้พักและเติมพลังก่อนกลับไปลุยต่อ"},{poem:["ทางลัดอาจพาไปเจอทางตัน","ทางตรงที่ช้าหน่อยปลอดภัยก
